[project]
name = "catchment"
version = "0.1.0"
description = "Given a DEM, channel heads, flow directions, and flow accumulation, extract the labeled channel network, catchments, reaches, and derived rasters (HAND/REM)"
authors = [
    {name = "Arthur Koehl", email = "avkoehl@ucdavis.edu"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numba>=0.62.1,<0.63.0",
    "numpy>=2.3.3,<3.0.0",
    "scipy>=1.16.2,<2.0.0",
    "pandas>=2.3.3,<3.0.0",
    "geopandas>=1.1.1,<2.0.0",
    "shapely>=2.1.2,<3.0.0",
    "rasterio",
    "rioxarray>=0.19.0,<0.20.0",
    "pysheds>=0.5,<0.6",
    "whitebox>=2.3.6,<3.0.0",
    "ruptures>=1.1.10,<2.0.0",
]

[dependency-groups]
dev = [
    "ipython>=9.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["catchment"]
